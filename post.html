<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Classic Matrix/Terminal Green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;

        }
        /* The "Scanline" effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
        }
        .container .footnote {
            text-align: right;
            font-size: 9px;
        }
        a {
            color: #00ff41; /* Force it to stay green */
        }
        a:hover {
            background-color: #00ff41;
            color: #0a0a0a;
        }
        hr {
            color: #00ff41;
        }
        .container hr {
            margin-left: -20px;
            margin-right: -20px;
        }
        spin {
            white-space: pre;
            display: inline;
        }
        .containerR {
            display: flex;
            border: 2px solid #00ff41;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
            justify-content: center;
        }
        .output {
            max-height: 200px;    /* Stops the box from growing vertically */
            overflow-y: auto;     /* Adds a vertical scrollbar only when text overflows */
        }
        h1 { text-transform: uppercase; letter-spacing: 5px; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

        <script type="module">
            import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
            import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.mjs';
            function converttoHTML(value) {
                return DOMPurify.sanitize(marked.parse(value))
            }
            window.converttoHTML = converttoHTML
            window.sanitize = DOMPurify.sanitize
        </script>
        <script>
            let data = 0
            let message = 0
            let target = 0
            let index = 0
            let textarea = document.getElementById("input")
            textarea.addEventListener("input", execute_render)
            let render = document.getElementById("render")
            let contents = []
            if (localStorage.getItem("language") === null) {
                lange = "en"
            } else {
                lange = localStorage.getItem("language")
            }

            function exec_button(action) {
                let tag = 0
                let tag2 = 0
                if (action == "underline") {
                    tag = "<u>"
                    tag2 = "</u>"
                }
                if (action == "stroke") {
                    tag = "~~"
                    tag2 = "~~"
                }   
                if (action == "italic"){
                    tag = "_"
                    tag2 = "_"
                }
                if (action == "bold"){
                    tag = "**"
                    tag2 = "**"
                }
                if(action == "color"){
                    tag = `<span style="color:magenta;">`
                    tag2 = "</span>"
                }
                if(action == "link"){   
                    tag = "["
                    tag2 = "](https://example.com)"
                }
                if (action == "image"){
                    tag = ""
                    tag2 = `<img src="assets/PFP's/standart.png">`
                }    
                textarea.value = `${textarea.value.slice(0,textarea.selectionStart)}${tag}${textarea.value.slice(textarea.selectionStart,textarea.selectionEnd)}${tag2}${textarea.value.slice(textarea.selectionEnd, textarea.value.length)}`
                execute_render()
            }
            function execute_render(){
                render.innerHTML = converttoHTML(textarea.value)
            }
            async function fetchtranslate() {
                let response = await fetch("translate")
                data = await response.json()
                await translatet()
            }
            function translate(){
                selector = document.getElementById("items")
                for (let i=1; i<4;i++){
                    let selected = document.getElementById(i.toString());
                    selected.innerHTML = data['error'][lange][i-1]
                }
                translatet()
            }
            function setcontents(){
                for (let i=1; i<5;i++){
                    target = document.getElementById(i.toString());
                    contents.push(target.innerHTML)
                    target.innerHTML = ""
                }
            }
            
            function typeMessage(elementId) {
                return new Promise((resolve) => {
                    let target = document.getElementById(elementId);
                    if (!target) { resolve(); return; }

                    
                    let temp = document.createElement('div');
                    temp.innerHTML = contents[elementId-1]; 
                    
                    
                    target.innerHTML = "";
                    
                    
                    async function typeNode(source, destination) {
                        let nodes = source.childNodes;
                        
                        for (let node of nodes) {
                            if (node.nodeType === Node.TEXT_NODE) {
                                if (destination.classList.contains("do_write")) {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char;
                                        await new Promise(r => setTimeout(r, 30)); 
                                    }
                                } else {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char; 
                                    }
                                }
                            } else {
                                
                                
                                let clone = node.cloneNode(false); 
                                clone.innerHTML = "";
                                destination.appendChild(clone);
                                
                                
                                await typeNode(node, clone);
                            }
                        }
                    }

                    typeNode(temp, target).then(resolve);
                });
            }

            
            async function executeInOrder() {
                await fetchtranslate()
                execute_render()
            }

            window.onload = executeInOrder;
    </script>

</html>
