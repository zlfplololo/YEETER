<!DOCTYPE html>

<head>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Classic Matrix/Terminal Green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* The "Scanline" effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
        }
        .container .footnote {
            text-align: right;
            font-size: 9px;
        }
        a {
            color: #00ff41; /* Force it to stay green */
        }
        a:hover {
            background-color: #00ff41;
            color: #0a0a0a;
        }
        .containerR {
            display: flex;
            border: 2px solid #00ff41;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
            justify-content: center;
        }
        hr {
            color: #00ff41;
        }
        .container hr {
            margin-left: -20px;
            margin-right: -20px;
        }
        .pfp {
            border-radius: 50%;
            width: 50px;
            height: 50px;
        }
        .input {
            border: 2px solid #00ff41;
            box-shadow: 0 0 5px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
            color:#00ff41;
        }
        .popup {
            position: absolute;
            top:25%;
            left:25%;
            width: 50%;
            height: 50%;
        }
        h1 { text-transform: uppercase; letter-spacing: 5px; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>

        <script type="module">
            import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
            import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.mjs';
            function converttoHTML(value) {
                return DOMPurify.sanitize(marked.parse(value))
            }
            window.converttoHTML = converttoHTML
            window.sanitize = DOMPurify.sanitize
        </script>
        <script>
            let data = 0
            let message = 0
            let target = 0
            let index = 0
            let contents = []
            let image = ""
            let textarea = document.getElementById("input")
            textarea.addEventListener("input", execute_render)
            if (localStorage.getItem("language") === null) {
                lange = "en"
            } else {
                lange = localStorage.getItem("language")
            }

            async function getoptions() {
                let resultraw = await fetch("PFP's")
                let result = await resultraw.json()
                document.getElementById("picselection").innerHTML = ""
                for (i of result) {
                    document.getElementById("picselection").insertAdjacentHTML('beforeend', `<option value="${i}">${i}</option>`)
                }
                onchange()
            }
            document.getElementById("picselection").addEventListener('change', onchange)
            function onchange() {
                document.getElementById("picselect").innerHTML = `<img class="pfp" src="assets/PFP's/${document.getElementById("picselection").value}">`
            }

            async function send() {
                    let resulte = await fetch('/', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({"action": "user/update status", "pfp":image, "name": document.getElementById("name").value, "description": textarea.value, "at":localStorage.getItem("UAT")})
                    })
            }
            
            async function fetchtranslate() {
                let response = await fetch("translate")
                data = await response.json()
                console.log(data)
                await translatet()
            }
            function translate(){
                selector = document.getElementById("items")
                for (let i=1; i<4;i++){
                    let selected = document.getElementById(i.toString());
                    selected.innerHTML = data['error'][lange][i-1]
                }
                translatet()
            }
            function setcontents(){
                for (let i=1; i<5;i++){
                    target = document.getElementById(i.toString());
                    contents.push(target.innerHTML)
                    target.innerHTML = ""
                }
            }
            function execute_render(){
                render.innerHTML = converttoHTML(textarea.value)
            }
            
            function typeMessage(elementId) {
                return new Promise((resolve) => {
                    let target = document.getElementById(elementId);
                    if (!target) { resolve(); return; }

                    
                    let temp = document.createElement('div');
                    temp.innerHTML = contents[elementId-1]; 
                    
                    
                    target.innerHTML = "";
                    
                    
                    async function typeNode(source, destination) {
                        let nodes = source.childNodes;
                        
                        for (let node of nodes) {
                            if (node.nodeType === Node.TEXT_NODE) {
                                if (destination.classList.contains("do_write")) {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char;
                                        await new Promise(r => setTimeout(r, 30)); 
                                    }
                                } else {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char; 
                                    }
                                }
                            } else {
                                
                                
                                let clone = node.cloneNode(false); 
                                clone.innerHTML = "";
                                destination.appendChild(clone);
                                
                                
                                await typeNode(node, clone);
                            }
                        }
                    }

                    typeNode(temp, target).then(resolve);
                });
            }

            async function changepic(value) {
                document.getElementById("pic").innerHTML = `<img class = "pfp" src = "assets/PFP's/${value}">`
                image = sanitize(value)
                document.getElementById("picname").innerHTML = value
                document.getElementById("secectpic").style.display = "none"
            }
            async function setup() {
                if (localStorage.getItem("UAT") == null) {
                    document.getElementById("mainwindow").innerHTML = {en: "<p style=\"color:red;\">Please login fist</p>", ua:"<p style=\"color:red;\">будьласка ввойдiть спочатку</p>"}[lange]
                } else {
                    let dataraw =  await fetch(`userdata/${localStorage.getItem("UAT")}`)
                    let data = await dataraw.json()
                    console.log(data)
                    document.getElementById("pic").innerHTML = `<img class = "pfp" src = "assets/PFP's/${data[0]}">`
                    image = sanitize(data[0])
                    document.getElementById("picname").innerHTML = data[0]
                    document.getElementById("name").value = sanitize(data[1])
                    document.getElementById("image").value  = ''
                    textarea.value = data[3]
                }
            }
            
            async function executeInOrder() {
                setup()
                await fetchtranslate()
                execute_render()
            }

            window.onload = executeInOrder;
    </script>
