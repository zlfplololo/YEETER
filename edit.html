<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Classic Matrix/Terminal Green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        /* The "Scanline" effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
        }
        .container .footnote {
            text-align: right;
            font-size: 9px;
        }
        a {
            color: #00ff41; /* Force it to stay green */
        }
        a:hover {
            background-color: #00ff41;
            color: #0a0a0a;
        }
        .containerCenter {
            display: flex;
            justify-content: center;
            width: 100%;
            align-items: center;
        }
        .containerE {
            display: flex;
            border: 2px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            width: 100vw;
            box-sizing: border-box;
        }
        .containerG {
            padding: 10px;
            text-align: center;
            display: grid;
            box-sizing: border-box;
            grid-template-columns: auto 1fr; /* PFP takes its own width, text takes the rest */
            column-gap: 10px;
            row-gap: 10px;
            width: 10%;
        }
        .fir {
            grid-row: span 2;
            align-self: top;
        }
        .sec {
            grid-column: 2;
        }
        select {
            border: 2px solid #00ff41;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
            color: #00ff41;
        }
        .belllottie {
            width: 2.5cm;
            height: 2.5cm;
        }
        .invisiblebutton {
            border: 0px solid #00ff4100;
            background: #00000000;
            color: #00ff41;
        }
        hr {
            color: #00ff41;
        }
        .container hr {
            margin-left: -20px;
            margin-right: -20px;
        }
        spin {
            white-space: pre;
            display: inline;
        }
        .pfp {
            border-radius: 50%;
            width: 50px;
            height: 50px;
        }
        .dive {
            display: none;
        }
        .post {
            width:max-content;
        }
        h1 { text-transform: uppercase; letter-spacing: 5px; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <template class = 'dive' id = "post">
        <div class="container post">
            <span style="display:flex;">
                <id class="dive" id="id"></id>
                <span style="display: flex; align-items: center; justify-content: start;"><span id = "post_pic">PFP</span><spin>  </spin><spin id = "post_name">UN</spin></span>
                <spin>  </spin>
                <span style="display: flex; align-items: center; justify-content: end; width: 100%;"><button class="buttone" id = "editbutton">edit</button><spin>  </spin><button class="buttone" id = "deletebutton">delete</button></span>
            </span>
            <hr>
            <p id = "post_content">POST</p>
        </div>
    </template>
    <div class="top containerN">
        <style>
        .containerN {
            border: 2px solid #00ff41;
            box-shadow: 0 0 15px #00ff41;
            background: rgba(9, 13, 9, 1);
            text-align: center;
        }
        .top {

        .buttone {

        .buttone:hover {

            color: #0a0a0a;

        </style>
        <p><a href="/" id = "1t">Home</a> <a href="/about" id = "2t">About</a> <span class = "trans" id = "3t">i am chineese</span></p>
        <script>
            function translatet() {
                for (let i=1; i<4;i++){
                    let selected = document.getElementById(`${i.toString()}t`);
                    if (i == 3) {
                        if (localStorage.getItem("UAT") == null) {
                            selected.innerHTML = data['top'][lange][i-1][0]

                        }

                    }

    </div>
    <div class="containerE" style="justify-content: center;flex-direction: column; row-gap: 20px; align-items: center;" id = "postspace">

    <p style="color: red;" id = "error"></p>

        <script type="module">
            import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
            import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.mjs';
            function converttoHTML(value) {
                return DOMPurify.sanitize(marked.parse(value))
            }
            window.converttoHTML = converttoHTML
            window.sanitize = DOMPurify.sanitize
        </script>
        <script>
            async function getbellsound() {
                let raw = await fetch("assets/bellsound")
                let blob = await raw.blob()
                let tempURL = await URL.createObjectURL(blob)
                let audio = new Audio(tempURL)
                return audio
            }
            async function getsubscribedto() {
                const userValue = await getuservalue(); 
                let dataraw =  await fetch(`userdata/${userValue}`)
                let data = await dataraw.json()
                return data[6]
            }
            async function getuservalue(){
                return await localStorage.getItem("UAT") 
            }
            async function deletepost(id) {
                let resultraw = await fetch('/', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({"action": "post/delete", "id":id})
                })
                let result = resultraw.json()
                if (result["status"] == 0) {
                    switch (result[error]) {
                        case "n/p":
                            document.getElementById("error").innerHTML = {en: "No post/Post already deleted", ua:"Немає поста/пост вже видален"}[lange]
                            break;
                    }
                }
            }
            async function editpost(id) {
                window.location.href = `/post?id=${id}`
            }
            function TFIO(value) {
                if (value) {
                    return 1
                } else {
                    return 0
                }
            }
            let lottieweb = import('https://esm.sh/lottie-web');
            let data = 0
            let message = 0
            let target = 0
            let index = 0
            let contents = []
            let bellsound = getbellsound()
            if (localStorage.getItem("language") === null) {
                lange = "en"
            } else {
                lange = localStorage.getItem("language")
            }

            async function updatefollowstatusonposts() {
                let SBCT = await getsubscribedto()
                let UV = await getuservalue()
                document.getElementById("postspace").querySelectorAll(".post").forEach(element => {
                    console.log(element)
                    element.querySelector("#followbutton").innerHTML = data['page'][lange][1][TFIO(SBCT.includes(UV))]
                })
            }
            async function sendfollowrequest() {
                let who = await getuservalue()
                let resulte = await fetch('/', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({"action": "user/follow", "AT": localStorage.getItem("UAT"), "who": who})
                })
                updatefollowercount()
                updatefollowstatusonposts()
            }
            async function makepost(id, at, content){
                let template = document.getElementById("post")
                let clone = template.content.cloneNode(true)
                let shortinforaw = await fetch(`usershort/${at}`)
                let shortinfo = await shortinforaw.json()
                clone.getElementById("post_pic").innerHTML = `<img class = "pfp" src = "assets/PFP's/${shortinfo[0]}">`
                clone.getElementById("post_name").innerHTML =  await sanitize(shortinfo[1])
                clone.getElementById("post_content").innerHTML = await converttoHTML(content)
                clone.getElementById("id").innerHTML = `${id}`
                clone.getElementById("editbutton").addEventListener("click", ()=>{editpost(id)})
                clone.getElementById("deletebutton").addEventListener("click", ()=>{deletepost(id)})
                return clone
            }
            async function updatefollowercount() {
                const userValue = await getuservalue(); 
                let dataraw =  await fetch(`userdata/${userValue}`)
                let data = await dataraw.json()
                document.getElementById("followers").innerHTML = data[4]
            }
            async function getinfo() {
                const userValue = await getuservalue(); 
                let dataraw =  await fetch(`userdata/${userValue}`)
                let data = await dataraw.json()
                for (i of data[5]) {
                    console.log(i)
                    document.getElementById("postspace").append(await makepost(i[0], data[2], i[2]))
                }
            }

            async function fetchtranslate() {
                let response = await fetch("translate")
                data = await response.json()
                console.log(data)
                await translatet()
            }
            async function translate(){
                selector = document.getElementById("items")
                for (let i=1; i<3;i++){
                    let selected = document.getElementById(i.toString());
                    if (i == 2) {
                        let SBCT = await getsubscribedto()
                        let UV = await getuservalue()
                        selected.innerHTML = data['page'][lange][i-1][TFIO(SBCT.includes(UV))]
                    } else {
                        selected.innerHTML = data['page'][lange][i-1]
                    }
                }
                translatet()
            }
            function setcontents(){
                for (let i=1; i<5;i++){
                    target = document.getElementById(i.toString());
                    contents.push(target.innerHTML)
                    target.innerHTML = ""
                }
            }
            async function ye_olde_bell() {
                bell = document.getElementById("bell")
                animationaddress =  await fetch("assets/bell")
                animation = await animationaddress.json()
                locallottie = await lottieweb
                animationinuse = locallottie.default.loadAnimation({
                    container: document.getElementById("bell"),
                    renderer: "svg",
                    loop:false,
                    autoplay:false,
                    animationData:animation,
                    rendererSettings: {
                        preserveAspectRatio: 'xMidYMid meet' // Scales uniformally to fit
                        // Use 'xMidYMid slice' to zoom and fill the container completely
                    }
                })
                //0>~70>~175>225
                bell.addEventListener("click", async function() {
                    let bellsounde = await bellsound 
                    bellsounde.play()
                    animationinuse.playSegments([0,225], true)
                })
            }
            function typeMessage(elementId) {
                return new Promise((resolve) => {
                    let target = document.getElementById(elementId);
                    if (!target) { resolve(); return; }

                    
                    let temp = document.createElement('div');
                    temp.innerHTML = contents[elementId-1]; 
                    
                    
                    target.innerHTML = "";
                    
                    
                    async function typeNode(source, destination) {
                        let nodes = source.childNodes;
                        
                        for (let node of nodes) {
                            if (node.nodeType === Node.TEXT_NODE) {
                                if (destination.classList.contains("do_write")) {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char;
                                        await new Promise(r => setTimeout(r, 30)); 
                                    }
                                } else {
                                    for (let char of node.nodeValue) {
                                        destination.innerHTML += char; 
                                    }
                                }
                            } else {
                                
                                
                                let clone = node.cloneNode(false); 
                                clone.innerHTML = "";
                                destination.appendChild(clone);
                                
                                
                                await typeNode(node, clone);
                            }
                        }
                    }

                    typeNode(temp, target).then(resolve);
                });
            }
            
            async function executeInOrder() {
                await fetchtranslate()
                getinfo()
            }

            window.onload = executeInOrder;
    </script>
